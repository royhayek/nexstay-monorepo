version: "3.8"

services:
  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
    volumes:
      # Persist LocalStack state
      - ~/localstack_data:/var/lib/localstack
      # Optional: auto-create buckets
      - ./init-scripts:/etc/localstack/init/ready.d