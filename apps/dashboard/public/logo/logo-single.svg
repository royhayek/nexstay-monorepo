<svg viewBox="-10 -10 116 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Simple top-to-bottom gradient for natural depth -->
    <linearGradient id="simple3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle light glow for elevation -->
    <filter id="cleanShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.17"/>
      <feComposite in2="offsetblur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon positioned at origin with no padding -->
  <g transform="translate(48, 75)" filter="url(#cleanShadow)">
    <!-- Main shape with simple gradient -->
    <g>
      <!-- N shape -->
      <path d="M -40 -45 L -40 45 L -22 45 L -22 -8 L 22 35 L 22 45 L 40 45 L 40 -45 L 22 -45 L 22 8 L -22 -35 Z" 
            fill="url(#simple3D)"/>
      
      <!-- Roof line -->
      <path d="M -48 -45 L 0 -75 L 48 -45" 
            fill="none" 
            stroke="url(#simple3D)" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      
      <!-- Location pin -->
      <circle cx="0" cy="-75" r="7" fill="url(#simple3D)"/>
      <circle cx="0" cy="-75" r="3" fill="#0B0B0B"/>
    </g>
  </g>
</svg>